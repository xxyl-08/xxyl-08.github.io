<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalKit 下载</title>
<meta name="description" content="GlobalKit — TikTok 地区解锁模块下载">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f1220,#1a1f33);color:#e8eaff;text-align:center;padding:24px}
  .logo{font-size:56px;margin-bottom:8px}
  h1{font-size:28px;font-weight:700}
  .sub{color:#a9b2d8;margin:8px 0 8px;font-size:15px}
  .ver{color:#8ea0ff;font-size:14px;margin-bottom:28px;min-height:20px}
  .btn{display:inline-block;padding:16px 48px;border-radius:14px;background:linear-gradient(90deg,#4da3ff,#8ea0ff);color:#fff;font-size:18px;font-weight:600;text-decoration:none;box-shadow:0 8px 24px rgba(77,163,255,.35);transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .msg{max-width:520px;color:#8f9ac4;font-size:13px;line-height:1.6;margin-top:20px;white-space:pre-wrap}
  .foot{margin-top:48px;color:#5b6385;font-size:12px}
</style>
</head>
<body>
  <div class="logo">🌍</div>
  <h1>GlobalKit</h1>
  <p class="sub">TikTok 地区解锁模块</p>
  <p class="ver" id="ver">正在获取最新版本…</p>
  <a class="btn" id="dl" href="https://github.com/xxyl-08/xxyl-08.github.io/releases/latest">⬇ 下载 APK</a>
  <p class="msg" id="msg"></p>
  <p class="foot">GlobalKit · © 2026 xxyl-08</p>

<script>
(function () {
  var OWNER = 'xxyl-08';
  var REPO  = 'xxyl-08.github.io';
  var SITE  = 'https://' + OWNER + '.github.io/';
  var REL_LATEST = 'https://github.com/' + OWNER + '/' + REPO + '/releases/latest';

  var verEl = document.getElementById('ver');
  var dlEl  = document.getElementById('dl');
  var msgEl = document.getElementById('msg');

  // 解析版本号：v125-1.2.3 / GlobalKit-v125-1.2.3-release.apk
  function parseVer(s) {
    var m = /v(\d+)-([\d.]+)/.exec(s || '');
    if (!m) return null;
    return { code: parseInt(m[1], 10), name: m[2] };
  }

  function apply(p, url) {
    if (!p) return false;
    verEl.textContent = '最新版本 v' + p.name;
    dlEl.href = url;
    return true;
  }

  var ts = '?ts=' + Date.now();

  // ① 首选：GitHub Release（在仓库「发布」里挂 APK 即可，无需上传 apk/ 目录）
  fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/releases' + ts,
        { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 403) throw { rateLimited: true };
      if (!r.ok) throw 0;
      return r.json();
    })
    .then(function (list) {
      if (!list || !list.length) throw 0;
      var rels = list.filter(function (x) { return !x.draft && !x.prerelease; });
      if (!rels.length) rels = list;

      var best = null, bestApk = null;
      for (var i = 0; i < rels.length; i++) {
        var rel = rels[i];
        var p = parseVer(rel.tag_name) || parseVer(rel.name);
        if (!p) continue;
        var apk = null;
        for (var j = 0; j < (rel.assets || []).length; j++) {
          if (/\.apk$/i.test(rel.assets[j].name)) { apk = rel.assets[j]; break; }
        }
        if (!apk) continue;
        if (!best || p.code > best.code) { best = p; bestApk = apk; }
      }

      if (!best) throw 0;
      apply(best, bestApk.browser_download_url);
    })
    .catch(function (err) {
      // ② 回退：扫描 apk/ 目录（兼容旧方式）
      fetch('https://data.jsdelivr.com/v1/packages/gh/' + OWNER + '/' + REPO + '@main?structure=flat&ts=' + Date.now(),
            { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (d) {
          var files = (d.files || []).map(function (f) { return String(f.name).replace(/^\//, ''); });
          var best = null, bestFile = null;
          for (var i = 0; i < files.length; i++) {
            if (!/\.apk$/i.test(files[i])) continue;
            var p = parseVer(files[i]);
            if (!p) continue;
            if (!best || p.code > best.code) { best = p; bestFile = files[i]; }
          }
          if (!best) throw 0;
          apply(best, SITE + bestFile);
        })
        .catch(function () {
          // ③ 全部失败：指向 Release 页面，仍可下载
          verEl.textContent = '最新版本';
          dlEl.href = REL_LATEST;
          msgEl.textContent = (err && err.rateLimited)
            ? '接口请求过于频繁，请点下载按钮前往 Release 页面自行选择。'
            : '';
        });
    });
})();
</script>
</body>
</html>
